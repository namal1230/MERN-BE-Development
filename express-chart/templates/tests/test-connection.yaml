apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "express-chart.fullname" . }}-test-connection"
  labels:
    {{- include "express-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36.1
      command: ['wget']
      args: ['-qO-', 'http://{{ include "express-chart.fullname" . }}:{{ .Values.service.port }}/ping']
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
          ephemeral-storage: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
          ephemeral-storage: 128Mi
  restartPolicy: Never
