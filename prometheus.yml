global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "jenkins"
    metrics_path: /prometheus
    static_configs:
      - targets: ['localhost:8080']
        
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'saas-app-backend'
    static_configs:
      - targets: ['server:3000']
